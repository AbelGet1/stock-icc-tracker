name: Deploy

on:
  push:
    branches:
      - main
      - initial_build
  workflow_dispatch:  # Allow manual triggers

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write  # Required for OIDC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: terraform/

      - name: Initialize Terraform
        run: terraform init
        working-directory: terraform/

      - name: Validate Terraform
        run: terraform validate
        working-directory: terraform/

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: terraform/
        continue-on-error: true

      - name: Apply Terraform
        run: terraform apply -auto-approve tfplan
        working-directory: terraform/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies for Lambda packaging
        run: |
          python -m pip install --upgrade pip
          pip install -r src/lambda/stock_analyzer/requirements.txt

      - name: Package Lambda function
        run: |
          cd src/lambda/stock_analyzer
          zip -r ../../../stock_analyzer.zip . -x "*.pyc" "__pycache__/*" "*.pyc"
        working-directory: .

      - name: Deploy Lambda function
        run: |
          FUNCTION_NAME=$(terraform output -raw lambda_function_name 2>/dev/null || echo "stock-icc-tracker-analyzer")
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://stock_analyzer.zip
        working-directory: terraform/
        continue-on-error: true