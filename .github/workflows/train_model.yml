name: Train ML Model

on:
  # Weekly schedule - Sunday at 6 AM UTC
  schedule:
    - cron: '0 6 * * 0'

  # Manual trigger
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (5 stocks only)'
        required: false
        default: 'false'
        type: boolean
      custom_stocks:
        description: 'Custom stock list (comma-separated, e.g., AAPL,MSFT,GOOGL)'
        required: false
        type: string

jobs:
  train:
    name: Train ML Model
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-training.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Set environment variables
        run: |
          echo "S3_BUCKET=${{ secrets.S3_BUCKET || 'stock-icc-tracker-storage' }}" >> $GITHUB_ENV
          echo "PYTHONPATH=${{ github.workspace }}/src" >> $GITHUB_ENV

      - name: Run model training
        id: train
        run: |
          # Build command based on inputs
          CMD="python scripts/train_model.py"

          if [ "${{ github.event.inputs.test_mode }}" == "true" ]; then
            CMD="$CMD --test"
            echo "Running in TEST mode"
          fi

          if [ -n "${{ github.event.inputs.custom_stocks }}" ]; then
            CMD="$CMD --stocks ${{ github.event.inputs.custom_stocks }}"
            echo "Using custom stocks: ${{ github.event.inputs.custom_stocks }}"
          fi

          echo "Executing: $CMD"
          $CMD 2>&1 | tee training_output.log

          # Extract metrics for summary
          echo "training_complete=true" >> $GITHUB_OUTPUT

      - name: Upload training logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-logs
          path: training_output.log
          retention-days: 30

      - name: Create training summary
        if: steps.train.outputs.training_complete == 'true'
        run: |
          echo "## ML Model Training Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Training Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Date:** $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Mode:** ${{ github.event.inputs.test_mode || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Model Location" >> $GITHUB_STEP_SUMMARY
          echo "- S3 Bucket: \`${{ env.S3_BUCKET }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Path: \`models/current/model.joblib\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Training Output (last 30 lines)" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          tail -30 training_output.log >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::ML Model training failed. Check the training logs for details."

  # Optional: Run a quick validation after training
  validate:
    name: Validate Model
    needs: train
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install boto3 joblib scikit-learn

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Validate model can be loaded
        run: |
          python -c "
          import boto3
          import joblib
          import tempfile
          import os

          s3 = boto3.client('s3')
          bucket = os.environ.get('S3_BUCKET', 'stock-icc-tracker-storage')

          with tempfile.TemporaryDirectory() as tmpdir:
              model_path = os.path.join(tmpdir, 'model.joblib')
              try:
                  s3.download_file(bucket, 'models/current/model.joblib', model_path)
                  model = joblib.load(model_path)
                  print(f'Model loaded successfully!')
                  print(f'Model type: {type(model).__name__}')
                  print(f'Number of estimators: {model.n_estimators}')
                  print('Validation PASSED')
              except Exception as e:
                  print(f'Validation FAILED: {e}')
                  exit(1)
          "
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET || 'stock-icc-tracker-storage' }}
